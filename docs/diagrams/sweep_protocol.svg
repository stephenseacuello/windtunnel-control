<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1160" width="1680" height="1160"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2277b3"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a7038"/></marker></defs><rect width="1680" height="1160" fill="#f5f8fb"/><text x="44" y="46" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0.5">BLADE SWEEP PROTOCOL</text><line x1="44" y1="60" x2="1636" y2="60" stroke="#b5985a" stroke-width="2.5"/><text x="1636" y="46" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b7288" text-anchor="end" letter-spacing="0">~10 minutes per rotor, unattended</text><rect x="44" y="84" width="1592" height="74" rx="8" fill="#fdf0ee" stroke="#b3261e" stroke-width="2.4"/><text x="70" y="118" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b3261e" text-anchor="start" letter-spacing="0.8">SETUP (ONCE)</text><text x="240" y="116" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0">Load ON at floor current</text><text x="560" y="116" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">— load before wind, always: an unloaded rotor in moving air runs away</text><rect x="200" y="186" width="1436" height="742" rx="10" fill="#ffffff" stroke="#2277b3" stroke-width="2.8"/><text x="226" y="226" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0">OUTER LOOP — wind speed</text><text x="580" y="216" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b7288" text-anchor="start" letter-spacing="0">500 → 1800 rpm fan in 100 rpm steps</text><text x="580" y="234" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b7288" text-anchor="start" letter-spacing="0">14 points  ·  10.1 → 37.5 m/s</text><text x="900" y="216" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#8a7038" text-anchor="start" letter-spacing="0">rpm = FAN speed</text><text x="900" y="234" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#8a7038" text-anchor="start" letter-spacing="0">m/s = WIND speed</text><rect x="250" y="258" width="336" height="62" rx="8" fill="#eaf1f8" stroke="#c0ddf2" stroke-width="1.8"/><circle cx="280" cy="289" r="16" fill="#002147"/><text x="280" y="294" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">1</text><text x="306" y="295" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#0d2338" text-anchor="start" letter-spacing="0">Command fan speed via the PMC</text><path d="M586,289 L616,289" fill="none" stroke="#2277b3" stroke-width="2.6" marker-end="url(#ah)"/><rect x="620" y="258" width="336" height="62" rx="8" fill="#eaf1f8" stroke="#c0ddf2" stroke-width="1.8"/><circle cx="650" cy="289" r="16" fill="#002147"/><text x="650" y="294" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">2</text><text x="676" y="295" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#0d2338" text-anchor="start" letter-spacing="0">Wait for the drive to reach it</text><path d="M956,289 L986,289" fill="none" stroke="#2277b3" stroke-width="2.6" marker-end="url(#ah)"/><rect x="990" y="258" width="336" height="62" rx="8" fill="#eaf1f8" stroke="#c0ddf2" stroke-width="1.8"/><circle cx="1020" cy="289" r="16" fill="#002147"/><text x="1020" y="294" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">3</text><text x="1046" y="295" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#0d2338" text-anchor="start" letter-spacing="0">Wait for terminal voltage to settle</text><text x="250" y="342" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b7288" text-anchor="start" letter-spacing="0">0.000 V is perfectly stable — speed must be confirmed first, not voltage</text><rect x="250" y="362" width="700" height="396" rx="10" fill="#f2f8f4" stroke="#1f7a52" stroke-width="2.4"/><text x="272" y="398" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f7a52" text-anchor="start" letter-spacing="0">INNER LOOP — load current ramp</text><rect x="272" y="416" width="656" height="60" rx="6" fill="#ffffff" stroke="#c0ddf2" stroke-width="1.6"/><circle cx="300" cy="440" r="14" fill="#1f7a52"/><text x="300" y="445" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">1</text><text x="324" y="444" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0d2338" text-anchor="start" letter-spacing="0">Set constant-current demand</text><text x="324" y="463" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="start" letter-spacing="0">20 mA at 1800 rpm, scaled as v² at lower wind</text><rect x="272" y="488" width="656" height="46" rx="6" fill="#ffffff" stroke="#c0ddf2" stroke-width="1.6"/><circle cx="300" cy="511" r="14" fill="#1f7a52"/><text x="300" y="516" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">2</text><text x="324" y="516" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0d2338" text-anchor="start" letter-spacing="0">Dwell 1.0 – 1.5 s</text><rect x="272" y="546" width="656" height="46" rx="6" fill="#ffffff" stroke="#c0ddf2" stroke-width="1.6"/><circle cx="300" cy="569" r="14" fill="#1f7a52"/><text x="300" y="574" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">3</text><text x="324" y="574" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0d2338" text-anchor="start" letter-spacing="0">Measure V and I,  compute P = V·I</text><path d="M600,610 L810,650 L600,690 L390,650 Z" fill="#ffffff" stroke="#002147" stroke-width="2.2"/><text x="600" y="646" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#0d2338" text-anchor="middle" letter-spacing="0">has power fallen to</text><text x="600" y="664" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">80% of its peak?</text><path d="M390,650 L290,650 L290,442 L272,442" fill="none" stroke="#1f7a52" stroke-width="2.4" marker-end="url(#ah)"/><text x="346" y="640" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f7a52" text-anchor="middle" letter-spacing="0">No</text><text x="600" y="710" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">Yes</text><rect x="1010" y="392" width="570" height="61" rx="8" fill="#fdf6ec" stroke="#b26a00" stroke-width="2.0"/><circle cx="1038" cy="420" r="13" fill="#b26a00"/><text x="1038" y="425" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">!</text><text x="1062" y="425" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#b26a00" text-anchor="start" letter-spacing="0">rotor stall</text><text x="1062" y="446" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">current stopped tracking demand</text><path d="M950,562 L1008,422.5" fill="none" stroke="#b26a00" stroke-width="2.0" marker-end="url(#ah)"/><rect x="1010" y="469" width="570" height="91" rx="8" fill="#fdf6ec" stroke="#b26a00" stroke-width="2.0"/><circle cx="1038" cy="497" r="13" fill="#b26a00"/><text x="1038" y="502" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">!</text><text x="1062" y="502" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#b26a00" text-anchor="start" letter-spacing="0">load cut-out</text><text x="1062" y="523" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">terminal voltage fell below the instrument's cut-off</text><text x="1062" y="538" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">first — this is the LOAD's limit, not the rotor's;</text><text x="1062" y="553" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">record as a lower bound</text><path d="M950,562 L1008,514.5" fill="none" stroke="#b26a00" stroke-width="2.0" marker-end="url(#ah)"/><rect x="1010" y="576" width="570" height="76" rx="8" fill="#fdf6ec" stroke="#b3261e" stroke-width="2.0"/><circle cx="1038" cy="604" r="13" fill="#b3261e"/><text x="1038" y="609" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">!</text><text x="1062" y="609" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#b3261e" text-anchor="start" letter-spacing="0">ceiling reached</text><text x="1062" y="630" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">never rolled off — the peak may not have been</text><text x="1062" y="645" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">reached</text><path d="M950,562 L1008,614.0" fill="none" stroke="#b3261e" stroke-width="2.0" marker-end="url(#ah)"/><rect x="250" y="778" width="700" height="66" rx="8" fill="#eaf1f8" stroke="#c0ddf2" stroke-width="1.8"/><circle cx="284" cy="811" r="16" fill="#002147"/><text x="284" y="816" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">4</text><text x="310" y="808" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0d2338" text-anchor="start" letter-spacing="0">Fit a parabola to the points around the maximum</text><text x="310" y="828" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="start" letter-spacing="0">the top of P(I) is flat — the single highest sample is biased high, and the bias grows with sample count</text><rect x="1010" y="778" width="300" height="66" rx="8" fill="#eaf1f8" stroke="#c0ddf2" stroke-width="1.8"/><circle cx="1044" cy="811" r="16" fill="#002147"/><text x="1044" y="816" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">5</text><text x="1070" y="817" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0d2338" text-anchor="start" letter-spacing="0">Unload to 0 A</text><path d="M950,811 L1008,811" fill="none" stroke="#2277b3" stroke-width="2.6" marker-end="url(#ah)"/><path d="M1310,811 L1580,811 L1580,894 L226,894 L226,289 L248,289" fill="none" stroke="#2277b3" stroke-width="2.6" marker-end="url(#ah)"/><rect x="820" y="881" width="260" height="26" fill="#f5f8fb"/><text x="950" y="899" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#2277b3" text-anchor="middle" letter-spacing="0">next wind speed</text><rect x="44" y="300" width="132" height="300" rx="8" fill="#ffffff" stroke="#1f7a52" stroke-width="2.4"/><text x="110" y="336" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f7a52" text-anchor="middle" letter-spacing="0.6">WATCHDOG</text><text x="110" y="354" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f7a52" text-anchor="middle" letter-spacing="0.6">TICK</text><text x="110" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0d2338" text-anchor="middle" letter-spacing="0">every</text><text x="110" y="414" font-family="SF Mono, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">1.0 s</text><text x="110" y="452" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">the PMC stops</text><text x="110" y="467" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">the fan if the</text><text x="110" y="482" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">host goes quiet</text><text x="110" y="497" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">for 5.0 s</text><text x="110" y="534" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">the DRIVE stops</text><text x="110" y="549" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">the fan if the</text><text x="110" y="564" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">PMC goes quiet</text><text x="110" y="579" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">for 3.0 s</text><path d="M176,450 L198,450" fill="none" stroke="#1f7a52" stroke-width="2.2" stroke-dasharray="6 4"/><rect x="44" y="950" width="1592" height="96" rx="8" fill="#001228" stroke="#001228" stroke-width="2"/><text x="74" y="990" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="1">SHUTDOWN</text><circle cx="260" cy="986" r="15" fill="#b5985a"/><text x="260" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#001228" text-anchor="middle" letter-spacing="0">1</text><text x="284" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0">Wind DOWN</text><circle cx="560" cy="986" r="15" fill="#b5985a"/><text x="560" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#001228" text-anchor="middle" letter-spacing="0">2</text><text x="584" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0">Load OFF</text><circle cx="840" cy="986" r="15" fill="#b5985a"/><text x="840" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#001228" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="991" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0">Write points + summary CSV with protocol fingerprint</text><text x="74" y="1024" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c0ddf2" text-anchor="start" letter-spacing="0">Strictly this order. If the fan cannot be confirmed stopped, the load stays on.  ·  Only runs with matching fingerprints are comparable.</text></svg>