<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1420" width="1080" height="1420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1420" fill="#ffffff"/>

  <text x="45" y="42" font-size="22" font-weight="700" fill="#002147">Commissioning Flow</text>
  <text x="45" y="63" font-size="12.5" fill="#5b7288">Phases 1–9 cannot move the fan, whatever goes wrong. Phase 10 is where that changes.</text>
  <line x1="45" y1="76" x2="1035" y2="76" stroke="#002147" stroke-width="1.5"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#30557e"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- ================= SAFE ZONE ================= -->
  <rect x="35" y="94" width="660" height="612" fill="#f7fbf9" stroke="#1f7a52"
        stroke-width="1.6" stroke-dasharray="8 4" rx="5"/>
  <text x="55" y="116" font-size="12" font-weight="700" fill="#1f7a52">FAN CANNOT MOVE</text>
  <text x="55" y="132" font-size="10.5" fill="#1f7a52">1001 and 1103 still point at the Aerolab panel — Modbus has no authority yet</text>

  <g font-size="12">
    <rect x="60" y="146" width="300" height="52" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="76" y="167" font-weight="700">1 · Record existing parameters</text>
    <text x="76" y="185" font-size="10.5" fill="#5b7288">WHILE POWERED. This is your only rollback.</text>

    <line x1="210" y1="198" x2="210" y2="216" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="222" width="300" height="52" fill="#fdeceb" stroke="#b3261e" stroke-width="1.6" rx="3"/>
    <text x="76" y="243" font-weight="700" fill="#b3261e">2 · Power down · LOTO · 5 min</text>
    <text x="76" y="261" font-size="10.5" fill="#b3261e">DC bus holds a lethal charge. Verify dead.</text>

    <line x1="210" y1="274" x2="210" y2="292" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="298" width="300" height="52" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="76" y="319" font-weight="700">3–4 · Open, land the cable</text>
    <text x="76" y="337" font-size="10.5" fill="#5b7288">Captive screw at top · X1-29/30/31 · J2 ON</text>

    <line x1="210" y1="350" x2="210" y2="368" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="374" width="300" height="52" fill="#fdf6e9" stroke="#b26a00" stroke-width="1.4" rx="3"/>
    <text x="76" y="395" font-weight="700" fill="#b26a00">5 · Close up · restore power</text>
    <text x="76" y="413" font-size="10.5" fill="#b26a00">Aerolab start switch OFF first — it auto-starts</text>

    <line x1="210" y1="426" x2="210" y2="444" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="450" width="300" height="52" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="76" y="471" font-weight="700">6 · Set comm parameters</text>
    <text x="76" y="489" font-size="10.5" fill="#b26a00">Then POWER-CYCLE. Group 53 reads at boot only.</text>

    <line x1="210" y1="502" x2="210" y2="520" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="526" width="300" height="52" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="76" y="547" font-weight="700">7–8 · Pi setup · prove comms</text>
    <text x="76" y="565" font-size="10.5" fill="#5b7288" font-family="ui-monospace,monospace">run.py monitor</text>

    <line x1="210" y1="578" x2="210" y2="596" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="602" width="300" height="60" fill="#e0f2f1" stroke="#2277b3" stroke-width="1.8" rx="3"/>
    <text x="76" y="623" font-weight="700" fill="#2277b3">9 · Self-test</text>
    <text x="76" y="641" font-size="10.5" fill="#2277b3" font-family="ui-monospace,monospace">run.py selftest</text>
    <text x="76" y="656" font-size="10" fill="#2277b3">Confirm par 1105 against the keypad — silent 10× risk</text>
  </g>

  <!-- comms failure branch -->
  <path d="M360 552 L430 552 L430 300 L500 300" fill="none" stroke="#b3261e"
        stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="437" y="545" font-size="10" fill="#b3261e">no reply</text>

  <rect x="500" y="252" width="180" height="150" fill="#fdeceb" stroke="#b3261e" stroke-width="1.4" rx="3"/>
  <text x="516" y="273" font-size="11.5" font-weight="700" fill="#b3261e">Bus silent?</text>
  <g font-size="10.5" fill="#b3261e">
    <text x="516" y="294">1. Swap X1-29 / 30</text>
    <text x="516" y="312">2. Check 5302/3/4</text>
    <text x="516" y="330">3. Did you power-cycle?</text>
    <text x="516" y="348">4. Keypad counters:</text>
    <text x="530" y="364" font-family="ui-monospace,monospace">5306 ok → PC side</text>
    <text x="530" y="379" font-family="ui-monospace,monospace">5307 CRC → noise</text>
    <text x="530" y="394" font-family="ui-monospace,monospace">5308 UART → parity</text>
  </g>

  <!-- ================= GATE ================= -->
  <line x1="210" y1="662" x2="210" y2="690" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="35" y="716" width="1010" height="76" fill="#fdeceb" stroke="#b3261e" stroke-width="2.4" rx="4"/>
  <text x="545" y="742" font-size="15" text-anchor="middle" font-weight="700" fill="#b3261e">10 · HAND OVER CONTROL — the fan becomes commandable here</text>
  <text x="545" y="762" font-size="11" text-anchor="middle" fill="#b3261e">Test section clear · test the E-stop · tell the lab · set 1103 = 8 and 1001 = 10 · sign on the tunnel</text>
  <text x="545" y="780" font-size="11" text-anchor="middle" fill="#b3261e">Shared tunnel? Do phase 10B — a DI selector keeps the Aerolab pot working</text>

  <line x1="545" y1="792" x2="545" y2="816" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ================= LIVE ZONE ================= -->
  <rect x="35" y="822" width="1010" height="404" fill="#fffdf7" stroke="#8a7038"
        stroke-width="1.6" stroke-dasharray="8 4" rx="5"/>
  <text x="55" y="844" font-size="12" font-weight="700" fill="#8a7038">FAN CAN MOVE</text>

  <g font-size="12">
    <rect x="60" y="858" width="290" height="66" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="76" y="879" font-weight="700">11 · First motion</text>
    <text x="76" y="897" font-size="10.5" fill="#5b7288" font-family="ui-monospace,monospace">run.py jog 10 --seconds 20</text>
    <text x="76" y="914" font-size="10.5" fill="#b26a00">Then pull the USB mid-run. Must fault in ~3 s.</text>

    <line x1="350" y1="891" x2="382" y2="891" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="390" y="858" width="290" height="66" fill="#e0f2f1" stroke="#2277b3" stroke-width="1.6" rx="3"/>
    <text x="406" y="879" font-weight="700" fill="#2277b3">12 · Verify the calibration</text>
    <text x="406" y="897" font-size="10.5" fill="#2277b3" font-family="ui-monospace,monospace">run.py verify --hz 30</text>
    <text x="406" y="914" font-size="10.5" fill="#2277b3">One reading settles Hz→RPM. No nameplate needed.</text>

    <line x1="680" y1="891" x2="712" y2="891" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="720" y="858" width="290" height="66" fill="#e0f2f1" stroke="#2277b3" stroke-width="1.6" rx="3"/>
    <text x="736" y="879" font-weight="700" fill="#2277b3">13 · Characterize</text>
    <text x="736" y="897" font-size="10.5" fill="#2277b3" font-family="ui-monospace,monospace">run.py characterize</text>
    <text x="736" y="914" font-size="10.5" fill="#2277b3">Step up AND down → τ rising, τ falling</text>

    <line x1="865" y1="924" x2="865" y2="948" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="720" y="954" width="290" height="60" fill="#fff" stroke="#30557e" stroke-width="1.4" rx="3"/>
    <text x="736" y="975" font-weight="700">14 · Tune the ramps</text>
    <text x="736" y="993" font-size="10.5" fill="#5b7288">Ramp dominating? Shorten 2202. Watch current.</text>
    <text x="736" y="1008" font-size="10.5" fill="#b26a00">Decel is limited by the DC bus, not by you.</text>
  </g>

  <!-- decision -->
  <path d="M865 1014 L865 1042 L545 1042 L545 1064" fill="none" stroke="#30557e" stroke-width="1.6" marker-end="url(#a)"/>

  <polygon points="545,1064 705,1112 545,1160 385,1112" fill="#eaf1f8" stroke="#30557e" stroke-width="1.6"/>
  <text x="545" y="1105" font-size="12" text-anchor="middle" font-weight="700">Retained amplitude</text>
  <text x="545" y="1123" font-size="11" text-anchor="middle" fill="#5b7288">from check_realizable()</text>

  <path d="M385 1112 L300 1112 L300 1176" fill="none" stroke="#1f7a52" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="342" y="1105" font-size="10.5" text-anchor="middle" fill="#1f7a52">≥ 85%</text>

  <path d="M705 1112 L790 1112 L790 1176" fill="none" stroke="#b26a00" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="748" y="1105" font-size="10.5" text-anchor="middle" fill="#b26a00">&lt; 70%</text>

  <line x1="45" y1="1250" x2="1035" y2="1250" stroke="#d3e0eb"/>

  <rect x="150" y="1182" width="300" height="54" fill="#edf7f2" stroke="#1f7a52" stroke-width="1.4" rx="3"/>
  <text x="300" y="1203" font-size="12" text-anchor="middle" font-weight="700" fill="#1f7a52">15 · Run experiments</text>
  <text x="300" y="1222" font-size="10.5" text-anchor="middle" fill="#1f7a52">gust · turbulence · sweep · csv</text>

  <rect x="640" y="1182" width="300" height="54" fill="#fdf6e9" stroke="#b26a00" stroke-width="1.4" rx="3"/>
  <text x="790" y="1200" font-size="12" text-anchor="middle" font-weight="700" fill="#b26a00">Lengthen the gust,</text>
  <text x="790" y="1217" font-size="11" text-anchor="middle" fill="#b26a00">shorten 2202, or --feedforward</text>
  <text x="790" y="1232" font-size="10" text-anchor="middle" fill="#b26a00">below ~6 s feedforward makes it worse</text>

  <text x="45" y="1280" font-size="13" font-weight="700" fill="#002147">Every session afterwards</text>
  <g font-size="11" fill="#0d2338" font-family="ui-monospace,monospace">
    <text x="45" y="1302">1.  set session — operator, configuration, notes</text>
    <text x="45" y="1322">2.  ambient --temperature --pressure       (cannot be reconstructed later)</text>
    <text x="45" y="1342">3.  preview / pre-flight before a long run</text>
    <text x="45" y="1362">4.  --settle at least 4τ                   (or the run starts mid-spin-up)</text>
    <text x="45" y="1382">5.  record the seed for turbulence         (or runs are not comparable)</text>
    <text x="45" y="1402">6.  analyze.py logs/*.csv --plot           (every run also measures the tunnel)</text>
  </g>
</svg>
