<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b4a63"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a1f"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7288"/></marker>
    <style>
      .t{font-size:13.5px;fill:#0d2338;font-weight:600}
      .s{font-size:10.5px;fill:#5b7288}
      .lbl{font-size:10px;fill:#2b4a63;font-weight:600}
      .lblp{font-size:10px;fill:#8a5a1f;font-weight:600}
      .box{fill:#fff;stroke:#c3d3e0;stroke-width:1.5;rx:7}
      .safe{fill:#eef7f0;stroke:#1f9d55;stroke-width:2}
      .warn{fill:#fdf4e7;stroke:#b8860b;stroke-width:1.5}
      .h{font-size:19px;fill:#0d2338;font-weight:700}
      .sub{font-size:12px;fill:#5b7288}
      .note{font-size:10.5px;fill:#3d5a72}
      .cap{font-size:11px;font-weight:700;fill:#5b7288;letter-spacing:.09em}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fbfcfd"/>
  <text x="46" y="46" class="h">Aerolab Wind Tunnel — Control &amp; Measurement Architecture</text>
  <text x="46" y="68" class="sub">University of Rhode Island · Sodhi lab, with Jeong lab on acquisition</text>

  <!-- ================= COMMAND CHAIN ================= -->
  <text x="46" y="112" class="cap">COMMAND</text>

  <rect class="box" x="46"  y="126" width="150" height="72"/>
  <text x="121" y="152" class="t" text-anchor="middle">Host (macOS / Pi)</text>
  <text x="121" y="170" class="s" text-anchor="middle">Python · logging</text>
  <text x="121" y="186" class="s" text-anchor="middle" fill="#b03030">not trusted with safety</text>

  <rect class="safe" x="256" y="126" width="168" height="72" rx="7"/>
  <text x="340" y="150" class="t" text-anchor="middle">Portenta Machine Ctrl</text>
  <text x="340" y="168" class="s" text-anchor="middle">owns the Modbus loop</text>
  <text x="340" y="184" class="s" text-anchor="middle" fill="#1f7a44">and BOTH watchdogs</text>

  <rect class="box" x="484" y="126" width="168" height="72"/>
  <text x="568" y="150" class="t" text-anchor="middle">ABB ACS550 VFD</text>
  <text x="568" y="168" class="s" text-anchor="middle">15 HP · 208–240 V 3φ</text>
  <text x="568" y="184" class="s" text-anchor="middle">speed ref, 2435 rpm FS</text>

  <rect class="box" x="712" y="126" width="132" height="72"/>
  <text x="778" y="158" class="t" text-anchor="middle">Fan motor</text>
  <text x="778" y="176" class="s" text-anchor="middle">3φ induction</text>

  <rect class="box" x="904" y="126" width="150" height="72"/>
  <text x="979" y="152" class="t" text-anchor="middle">Test section</text>
  <text x="979" y="170" class="s" text-anchor="middle">turbine rotor</text>
  <text x="979" y="186" class="s" text-anchor="middle">10.1 – 37.5 m/s</text>

  <line x1="196" y1="162" x2="252" y2="162" stroke="#2b4a63" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="224" y="154" class="lbl" text-anchor="middle">USB</text>
  <line x1="424" y1="162" x2="480" y2="162" stroke="#2b4a63" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="452" y="148" class="lbl" text-anchor="middle">RS-485</text>
  <text x="452" y="160" class="lbl" text-anchor="middle">Modbus</text>
  <text x="452" y="176" class="s" text-anchor="middle">X1-29/30/31</text>
  <line x1="652" y1="162" x2="708" y2="162" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ap)"/>
  <text x="680" y="152" class="lblp" text-anchor="middle">3φ</text>
  <line x1="844" y1="162" x2="900" y2="162" stroke="#5b7288" stroke-width="1.8" marker-end="url(#ad)"/>
  <text x="872" y="152" class="lbl" text-anchor="middle">wind</text>

  <!-- ================= POWER CHAIN ================= -->
  <text x="46" y="292" class="cap">POWER &amp; MEASUREMENT</text>

  <rect class="box" x="904" y="306" width="150" height="66"/>
  <text x="979" y="332" class="t" text-anchor="middle">Rectifier</text>
  <text x="979" y="350" class="s" text-anchor="middle">3φ → DC</text>

  <rect class="box" x="676" y="306" width="150" height="66"/>
  <text x="751" y="332" class="t" text-anchor="middle">V / I sense IC</text>
  <text x="751" y="350" class="s" text-anchor="middle">in series</text>

  <rect class="box" x="404" y="292" width="196" height="94"/>
  <text x="502" y="318" class="t" text-anchor="middle">Chroma 63004-150-60</text>
  <text x="502" y="336" class="s" text-anchor="middle">DC electronic load</text>
  <text x="502" y="352" class="s" text-anchor="middle">150 V · 60 A · 400 W</text>
  <text x="502" y="372" class="s" text-anchor="middle" font-style="italic">sets the operating point</text>

  <line x1="979" y1="198" x2="979" y2="302" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ap)"/>
  <text x="1000" y="252" class="lblp">rotor</text>
  <line x1="900" y1="339" x2="830" y2="339" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ap)"/>
  <line x1="672" y1="339" x2="604" y2="339" stroke="#8a5a1f" stroke-width="3" marker-end="url(#ap)"/>
  <text x="638" y="330" class="lblp" text-anchor="middle">DC</text>

  <path d="M404 320 L200 320 L200 198" fill="none" stroke="#2b4a63"
        stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="292" y="312" class="lbl" text-anchor="middle">USB-TMC (VISA) — SCPI</text>

  <!-- ================= DAQ ================= -->
  <rect class="warn" x="1084" y="292" width="150" height="94" rx="7"/>
  <text x="1159" y="318" class="t" text-anchor="middle">Jeong lab DAQ</text>
  <text x="1159" y="336" class="s" text-anchor="middle">6 ch · 300 Hz</text>
  <text x="1159" y="354" class="s" text-anchor="middle">ch3/4/6 = 3φ</text>
  <text x="1159" y="372" class="s" text-anchor="middle" fill="#8a6d1f">→ rotor rpm</text>
  <line x1="1054" y1="339" x2="1080" y2="339" stroke="#5b7288" stroke-width="1.6"
        stroke-dasharray="5 3" marker-end="url(#ad)"/>
  <line x1="1054" y1="162" x2="1159" y2="162" stroke="#5b7288" stroke-width="1.6"
        stroke-dasharray="5 3"/>
  <line x1="1159" y1="162" x2="1159" y2="288" stroke="#5b7288" stroke-width="1.6"
        stroke-dasharray="5 3" marker-end="url(#ad)"/>
  <text x="1120" y="154" class="s" text-anchor="middle">anemometer</text>

  <!-- ================= SAFETY ================= -->
  <rect x="46" y="434" width="1188" height="86" rx="8" fill="#fdf0f0" stroke="#c62828" stroke-width="2"/>
  <text x="66" y="462" class="t" fill="#8b1a1a">SAFETY CHAIN — entirely outside the software</text>
  <text x="66" y="482" class="note">Hardwired <tspan font-weight="700">E-STOP</tspan> in the contactor circuit · disconnect · the drive's own comm watchdog.</text>
  <text x="66" y="500" class="note">Nothing above is part of this chain, and nothing above should ever become part of it.</text>

  <!-- ================= INVARIANTS ================= -->
  <rect x="46" y="546" width="386" height="140" rx="8" fill="#fff" stroke="#c3d3e0" stroke-width="1.5"/>
  <text x="66" y="572" class="t">Two watchdogs</text>
  <text x="66" y="594" class="note">Drive par 3018/3019 — the drive stops the fan</text>
  <text x="66" y="610" class="note">if the <tspan font-weight="700">PMC</tspan> goes quiet.</text>
  <text x="66" y="634" class="note">PMC host watchdog — the PMC stops the fan</text>
  <text x="66" y="650" class="note">if the <tspan font-weight="700">host</tspan> goes quiet (5000 ms).</text>
  <text x="66" y="672" class="s">Do not put the host on a UPS.</text>

  <rect x="448" y="546" width="386" height="140" rx="8" fill="#fff" stroke="#c3d3e0" stroke-width="1.5"/>
  <text x="468" y="572" class="t">One Modbus master</text>
  <text x="468" y="594" class="note">RS-485 permits exactly one. The PMC is it.</text>
  <text x="468" y="616" class="note">A direct host-to-drive cable must never be</text>
  <text x="468" y="632" class="note">landed at the same time — two processes</text>
  <text x="468" y="648" class="note">commanding a 15 HP fan, neither aware of</text>
  <text x="468" y="664" class="note">the other, and neither log showing it.</text>

  <rect x="850" y="546" width="384" height="140" rx="8" fill="#eef7f0" stroke="#1f9d55" stroke-width="1.5"/>
  <text x="870" y="572" class="t">Turbine interlock</text>
  <text x="870" y="596" class="note" font-weight="700">load ON → wind UP → test → wind DOWN → load OFF</text>
  <text x="870" y="620" class="note">With the load off the rotor sees an open</text>
  <text x="870" y="636" class="note">circuit and accelerates until something</text>
  <text x="870" y="652" class="note">mechanical stops it. If the fan cannot be</text>
  <text x="870" y="668" class="note">confirmed stopped, <tspan font-weight="700">the load stays on.</tspan></text>
</svg>
