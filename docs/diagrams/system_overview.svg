e" letter-spacing="0">Generator</text><text x="1408.0" y="533.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">3-phase, on the rotor shaft</text><rect x="1044" y="470" width="216" height="92" rx="6" fill="#ffffff" stroke="#d3e0eb" stroke-width="1.8"/><text x="1152.0" y="512.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">Rectifier</text><text x="1152.0" y="533.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">3φ bridge → DC</text><rect x="800" y="470" width="216" height="92" rx="6" fill="#ffffff" stroke="#d3e0eb" stroke-width="1.8"/><text x="908.0" y="512.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">V / I sense IC</text><text x="908.0" y="533.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">series, 5 V supply</text><rect x="470" y="470" width="280" height="92" rx="6" fill="#ffffff" stroke="#b5985a" stroke-width="2.4"/><text x="610.0" y="512.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">Chroma 63004-150-60</text><text x="610.0" y="533.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">150 V / 60 A / 400 W</text><text x="610.0" y="548.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">sets the operating point</text><path d="M1424,422 L1424,436 L1408,436 L1408,468" fill="none" stroke="#8a7038" stroke-width="2.8" marker-end="url(#ahr)"/><path d="M1298,516 L1262,516" fill="none" stroke="#8a7038" stroke-width="2.8" marker-end="url(#ah)"/><path d="M1042,516 L1018,516" fill="none" stroke="#8a7038" stroke-width="2.8" marker-end="url(#ah)"/><path d="M798,516 L752,516" fill="none" stroke="#8a7038" stroke-width="2.8" marker-end="url(#ah)"/><path d="M468,516 L300,516" fill="none" stroke="#2277b3" stroke-width="2.6" marker-end="url(#ah)"/><text x="384" y="506" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5b7288" text-anchor="middle" letter-spacing="0">USB-TMC (VISA)</text><path d="M455,206 L455,516 L300,516" fill="none" stroke="none"/><rect x="120" y="470" width="180" height="92" rx="6" fill="#eaf1f8" stroke="#d3e0eb" stroke-width="1.8"/><text x="210.0" y="512.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">Host laptop</text><text x="210.0" y="533.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">the SAME laptop</text><text x="210.0" y="548.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">SCPI over VISA</text><rect x="1180" y="660" width="400" height="118" rx="6" fill="#eaf1f8" stroke="#1f7a52" stroke-width="3.0"/><text x="1380.0" y="715.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="0">Jeong Lab DAQ</text><text x="1380.0" y="736.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b7288" text-anchor="middle" letter-spacing="0">one time base for both speeds</text><path d="M1300,462 L1300,610 L1280,610 L1280,658" fill="none" stroke="#1f7a52" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="1258" y="600" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f7a52" text-anchor="end" letter-spacing="0">rotor rpm — proximity sensor, ALREADY RECORDED</text><path d="M455,204 L455,718 L1178,718" fill="none" stroke="#1f7a52" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="470" y="708" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f7a52" text-anchor="start" letter-spacing="0">fan rpm — PMC analog out O0,  0.5 V + rpm/300 (firmware v4)</text><rect x="44" y="828" width="830" height="128" rx="8" fill="#ffffff" stroke="#2277b3" stroke-width="2.4"/><text x="66" y="858" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#2277b3" text-anchor="start" letter-spacing="0.8">TWO INDEPENDENT WATCHDOGS</text><text x="66" y="888" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0">The DRIVE stops the fan if the PMC goes quiet</text><text x="66" y="907" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5b7288" text-anchor="start" letter-spacing="0">par 3018 / 3019  ·  3.0 s</text><text x="470" y="888" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0">The PMC stops the fan if the HOST goes quiet</text><text x="470" y="907" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5b7288" text-anchor="start" letter-spacing="0">5.0 s</text><text x="66" y="934" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">Neither depends on the layer above it being correct. One Modbus master only — the PMC.</text><rect x="908" y="828" width="672" height="128" rx="8" fill="#ffffff" stroke="#b5985a" stroke-width="2.4"/><text x="930" y="858" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a7038" text-anchor="start" letter-spacing="0.8">TURBINE INTERLOCK</text><text x="930" y="890" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#002147" text-anchor="start" letter-spacing="0">load ON → wind UP → test → wind DOWN → load OFF</text><text x="930" y="920" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">An unloaded rotor in moving air accelerates. If the fan cannot be</text><text x="930" y="937" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">confirmed stopped, the load stays on.</text><rect x="44" y="990" width="1536" height="84" rx="8" fill="#fdf0ee" stroke="#b3261e" stroke-width="2.8"/><circle cx="96" cy="1032" r="21" fill="#b3261e"/><circle cx="96" cy="1032" r="12" fill="#fdf0ee"/><text x="140" y="1026" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#b3261e" text-anchor="start" letter-spacing="0">HARDWIRED E-STOP → contactor circuit</text><text x="140" y="1050" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0d2338" text-anchor="start" letter-spacing="0">This is the safety device. No software is in this chain — everything above only reduces how often it is needed.</text></svg>